<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Questão 04</title>
    <script src="questao04.js" defer></script>
</head>
<body>

    <h2>Validação de Cadastro</h2>

    <form>

        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome"><br><br>

        <label for="dataNasc">Data de nascimento:</label><br>
        <input type="date" id="dataNasc"><br><br>

        <label for="cpf">CPF:</label><br>
        <input type="text" id="cpf" placeholder="000.000.000-00"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email"><br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="text" id="telefone" placeholder="(xx) xxxxx-xxxx"><br><br>

        <button type="button" onclick="validarFormulario()">Validar Cadastro</button>

    </form>

    <hr>

    <p id="mensagem"></p>

</body>
</html>
